name: Smoke Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Frente 14 (segunda camada, carga real), Lote 10: sem SMOKE_BASE_URL
      # configurado, o step abaixo era silenciosamente pulado (`if`) e o job
      # ainda assim aparecia verde no Actions — indistinguível de "smoke
      # passou" pra quem só olha o resumo, quando na verdade nada foi
      # testado. Este step torna esse estado visível no log.
      - name: Avisar se SMOKE_BASE_URL não está configurado
        if: ${{ env.SMOKE_BASE_URL == '' }}
        run: |
          echo "::warning::SMOKE_BASE_URL não configurado — o smoke test pós-deploy foi PULADO, não passou. Configure o secret SMOKE_BASE_URL para ativar este gate de verdade."
      - name: Run smoke flow script
        if: ${{ env.SMOKE_BASE_URL != '' }}
        env:
          BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: node scripts/smoke.ts
