name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test?schema=public
      - run: npm run lint
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-key
          NODE_ENV: test
      - run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/marketplace_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-with-at-least-32-characters
          CORS_ORIGIN: http://localhost:8081,http://localhost:3000
          MP_ACCESS_TOKEN: TEST-ci-placeholder-access-token
          MP_PUBLIC_KEY: TEST-ci-placeholder-public-key
          NODE_ENV: test

  mobile-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload mobile coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-report
          path: mobile-app/coverage
          if-no-files-found: warn
