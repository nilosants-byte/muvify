# Professional: abre o editor de perfil (via drawer > Meu perfil) e verifica campos
# Executa: maestro test professional/02-profile-editor.yaml

appId: com.personalapp.mobile
---
- launchApp:
    clearState: true

- runFlow: ../helpers/_login-professional.yaml

- tapOn:
    id: "button.professional.open-drawer"

- tapOn:
    id: "button.professional.drawer.my-profile"

- takeScreenshot: "professional-profile-screen"

# Verifica que o nome do profissional QA está visível
- assertVisible: "QA Personal"
