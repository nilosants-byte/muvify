# Admin: acessa a tela de validação de CREF
# Verifica que o painel admin carrega e navegação funciona
# Executa: maestro test admin/01-cref-validation.yaml

appId: com.personalapp.mobile
---
- launchApp:
    clearState: true

- runFlow: ../helpers/_login-admin.yaml

# Tela inicial do admin deve mostrar o título
- assertVisible: "Administrador"
- takeScreenshot: "admin-home-loaded"

# Abre menu lateral
- tapOn:
    id: "button.admin.menu-toggle"

- assertVisible: "Validacao de CREF"
- takeScreenshot: "admin-menu-open"

# Navega para validação de CREF
- tapOn:
    text: "Validacao de CREF"

- takeScreenshot: "admin-cref-screen"
