# Helper: faz logout do usuário atual
# Pré-condição: usuário autenticado em qualquer tela principal
# Uso: runFlow: helpers/_logout.yaml

appId: com.personalapp.mobile
---
# Abre o menu lateral / navega para Perfil e faz logout
# Estratégia: tap no botão de perfil da tab bar e depois em Sair
- tapOn:
    text: "Perfil"

- tapOn:
    text: "Sair"

- assertVisible:
    id: "screen.auth.login"
- takeScreenshot: "logout-success"
