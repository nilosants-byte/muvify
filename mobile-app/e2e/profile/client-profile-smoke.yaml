appId: com.personalapp.mobile
name: Profile - Client profile access
tags:
  - profile
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 30000
- tapOn:
    id: input.auth.login.email
- inputText: qa.cliente@muvify.dev
- tapOn:
    id: input.auth.login.password
- inputText: "12345678"
- hideKeyboard
- tapOn:
    id: button.auth.login.submit
- extendedWaitUntil:
    visible:
      id: screen.client.home
    timeout: 45000
- tapOn:
    id: nav.bottom.profile
- extendedWaitUntil:
    visible:
      id: screen.client.profile
    timeout: 20000
- takeScreenshot: profile-client-screen
