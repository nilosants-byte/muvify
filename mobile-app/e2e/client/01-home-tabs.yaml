# Client: navegação pelas 5 abas da bottom nav (ClientBottomNavV2)
# Executa: maestro test client/01-home-tabs.yaml

appId: com.personalapp.mobile
---
- launchApp:
    clearState: true

- runFlow: ../helpers/_login-client.yaml

# Verifica tab Início (ativa por padrão)
- assertVisible:
    id: "screen.client.home"
- takeScreenshot: "client-tab-inicio"

# Navega para Agenda
- tapOn:
    id: "nav.client.v2.agenda"
- assertVisible:
    id: "screen.client.bookings"
- takeScreenshot: "client-tab-agenda"

# Navega para Treino
- tapOn:
    id: "nav.client.v2.trainings"
- assertVisible:
    id: "screen.client.training"
- takeScreenshot: "client-tab-treino"

# Navega para Comunidade
- tapOn:
    id: "nav.client.v2.community"
- assertVisible:
    id: "screen.client.community"
- takeScreenshot: "client-tab-comunidade"

# Navega para Perfil
- tapOn:
    id: "nav.client.v2.profile"
- assertVisible:
    id: "screen.client.profile"
- takeScreenshot: "client-tab-perfil"

# Volta para Início
- tapOn:
    id: "nav.client.v2.home"
- assertVisible:
    id: "screen.client.home"
