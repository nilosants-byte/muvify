# Auth: navegação para tela de recuperação de senha
# Executa: maestro test auth/06-forgot-password.yaml

appId: com.personalapp.mobile
---
- launchApp:
    clearState: true

- assertVisible:
    id: "screen.auth.login"

# Toca no link "Esqueceu a senha?"
- tapOn:
    id: "button.auth.login.forgot-password"

# Aguarda tela de recuperação de senha
- assertVisible: "Recuperar senha"
- takeScreenshot: "auth-forgot-password-screen"
