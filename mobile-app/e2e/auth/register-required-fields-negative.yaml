appId: com.personalapp.mobile
name: Auth - Register required fields
tags:
  - auth
  - negative
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 30000
- tapOn:
    id: button.auth.login.go-register
- extendedWaitUntil:
    visible:
      id: screen.auth.register
    timeout: 15000
- tapOn:
    id: button.auth.register.submit
- assertVisible: Preencha todos os campos.
- takeScreenshot: auth-register-required-fields
