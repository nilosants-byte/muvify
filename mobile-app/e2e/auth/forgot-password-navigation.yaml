appId: com.personalapp.mobile
name: Auth - Forgot password navigation
tags:
  - auth
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 30000
- tapOn:
    id: button.auth.login.forgot-password
- extendedWaitUntil:
    visible:
      id: screen.auth.forgot-password
    timeout: 15000
- assertVisible:
    id: input.auth.forgot.email
- takeScreenshot: auth-forgot-password-navigation
