# Auth: login com credenciais inválidas
# Verifica que mensagem de erro é exibida
# Executa: maestro test auth/03-login-invalid-credentials.yaml

appId: com.personalapp.mobile
---
- launchApp:
    clearState: true

- assertVisible:
    id: "screen.auth.login"

- tapOn:
    id: "input.auth.login.email"
- clearText
- inputText: "usuario.inexistente@muvify.local"

- tapOn:
    id: "input.auth.login.password"
- clearText
- inputText: "SenhaErrada123"

- tapOn:
    id: "button.auth.login.submit"

# Aguarda resposta da API e verifica mensagem de erro
# (mensagem genérica por desenho — não revela se o e-mail existe ou não)
- assertVisible: "Credenciais inválidas"
- takeScreenshot: "auth-login-invalid-credentials"

# Deve permanecer na tela de login
- assertVisible:
    id: "screen.auth.login"
