appId: com.personalapp.mobile
name: Auth - Reset password validation
tags:
  - auth
  - negative
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 30000
- tapOn:
    id: button.auth.login.forgot-password
- extendedWaitUntil:
    visible:
      id: screen.auth.forgot-password
    timeout: 15000
- tapOn:
    id: button.auth.forgot.submit
- assertVisible: Informe seu e-mail.
- takeScreenshot: auth-forgot-required-email
