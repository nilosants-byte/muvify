appId: com.personalapp.mobile
name: Auth - Provider login success
tags:
  - auth
  - positive
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 30000
- tapOn:
    id: input.auth.login.email
- inputText: qa.pro@muvify.dev
- tapOn:
    id: input.auth.login.password
- inputText: "12345678"
- hideKeyboard
- tapOn:
    id: button.auth.login.submit
- extendedWaitUntil:
    visible:
      id: screen.professional.home
    timeout: 45000
- assertVisible:
    id: nav.bottom.home
- takeScreenshot: auth-provider-login-success
