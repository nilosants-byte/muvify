appId: com.personalapp.mobile
name: Smoke - App launch
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 30000
- assertVisible:
    id: input.auth.login.email
- assertVisible:
    id: button.auth.login.submit
- takeScreenshot: smoke-login-screen
