# Helper: autentica como administrador (ADMIN)

appId: com.personalapp.mobile
---
- tapOn:
    id: "input.auth.login.email"
- clearText
- inputText: ${ADMIN_EMAIL}

- tapOn:
    id: "input.auth.login.password"
- clearText
- inputText: ${ADMIN_PASSWORD}

- tapOn:
    id: "button.auth.login.submit"

- assertVisible: "Administrador"
- takeScreenshot: "login-admin-success"
